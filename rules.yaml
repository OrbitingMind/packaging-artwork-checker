- id: "R01"
  name: "Net quantity present"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "always"
  spec_field: "net_quantity"
  what_to_extract: "Net quantity statement including numerical value and measurement unit."
  pass_condition: "A net quantity statement is clearly detected and extracted from the label."
  fail_condition: "No net quantity statement or value is found on the label."
  review_condition: "The net quantity text is partially occluded, blurry, or detected with low OCR confidence."

- id: "R02"
  name: "Net quantity matches spec"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "always"
  spec_field: "net_quantity"
  what_to_extract: "Declared net quantity numerical value and measurement unit."
  pass_condition: "The extracted net quantity value and unit match the approved specification."
  fail_condition: "The extracted net quantity numerical value differs from the approved specification."
  review_condition: "The extracted net quantity digits or unit are ambiguous or detected with low OCR confidence."

- id: "R03"
  name: "Correct unit"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "always"
  spec_field: "net_quantity"
  what_to_extract: "Measurement unit symbol used in the net quantity declaration."
  pass_condition: "The net quantity unit conforms to legal metrology standards using approved lower-case symbols such as g, kg, ml, or l."
  fail_condition: "The net quantity unit uses non-standard or unapproved forms such as gm, gms, grams, or uppercase G."
  review_condition: "The unit characters cannot be clearly distinguished from surrounding text or have low OCR confidence."

- id: "R04"
  name: "Veg mark present"
  fssai_clause: "VERIFY"
  check_type: "llm"
  applies_when: "always"
  spec_field: "veg_mark"
  what_to_extract: "Vegetarian logo consisting of a green square outline containing a green filled circle."
  pass_condition: "A valid vegetarian logo symbol with a green square border and filled green circle is clearly present."
  fail_condition: "No vegetarian logo symbol is detected on the packaging."
  review_condition: "A symbol is detected but its colors, geometry, or clarity are degraded, ambiguous, or have low model confidence."

- id: "R05"
  name: "Allergen section present"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "spec.has_allergens == true"
  spec_field: "allergens"
  what_to_extract: "Allergen declaration section heading and text on the packaging."
  pass_condition: "An allergen information heading and declaration statement are present on the packaging."
  fail_condition: "The allergen section is missing when the approved specification requires allergen disclosure."
  review_condition: "Potential allergen heading text is faint, fragmented, or detected with low OCR confidence."

- id: "R06"
  name: "Allergens match spec"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "spec.has_allergens == true"
  spec_field: "allergens"
  what_to_extract: "Specific allergen ingredients named in the allergen declaration statement."
  pass_condition: "All allergen ingredients listed in the approved specification are declared on the label."
  fail_condition: "One or more allergen ingredients specified in the approved specification are missing from the declaration."
  review_condition: "Allergen ingredient names are partially truncated, misspelled due to noise, or detected with low OCR confidence."

- id: "R07"
  name: "Ingredients match spec"
  fssai_clause: "VERIFY"
  check_type: "llm"
  applies_when: "always"
  spec_field: "ingredients"
  what_to_extract: "Complete list of ingredients declared on the label."
  pass_condition: "All ingredients and percentages on the label semantically match the approved specification ingredients list."
  fail_condition: "One or more ingredients from the specification are missing, altered, or substituted with unauthorized ingredients."
  review_condition: "Ingredient text contains unreadable words, complex punctuation variations, or low OCR confidence segments."

- id: "R08"
  name: "Manufacturer name and address present"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "always"
  spec_field: "manufacturer"
  what_to_extract: "Manufacturer name and complete physical postal address including city and PIN code."
  pass_condition: "The manufacturer heading along with company name and physical address are present on the label."
  fail_condition: "The manufacturer name or postal address is absent from the packaging."
  review_condition: "Address details are partially clipped, obscured by packaging artwork, or detected with low OCR confidence."

- id: "R09"
  name: "FSSAI number is 14 digits"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "always"
  spec_field: "fssai_license"
  what_to_extract: "FSSAI license number text declared on the packaging."
  pass_condition: "The declared FSSAI license number consists of exactly 14 numeric digits matching the specification."
  fail_condition: "The declared FSSAI license number does not contain exactly 14 digits or digits do not match."
  review_condition: "FSSAI digits are blurred, confused by OCR character substitutions (e.g. O vs 0), or have low OCR confidence."

- id: "R10"
  name: "MRP and best-before present"
  fssai_clause: "VERIFY"
  check_type: "deterministic"
  applies_when: "always"
  spec_field: "mrp, best_before"
  what_to_extract: "Maximum Retail Price (MRP) statement and Best-Before or expiry statement."
  pass_condition: "Both the Maximum Retail Price (MRP) and the Best-Before declaration are present on the packaging."
  fail_condition: "Either the MRP declaration or the Best-Before declaration is missing from the packaging."
  review_condition: "Price or date statements are partially worn, faint, truncated, or detected with low OCR confidence."
